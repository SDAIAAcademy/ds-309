<section>
<h2>Day 1: Find the personal data</h2>
<ol>
<li><p>Malak replaces each national identifier with its SHA-256 hash and removes names. Birth date, gender and postcode stay. Waad says the extract is now anonymous. What do you answer?</p><ul><li><b>A.</b> Yes: a hash cannot be reversed, so nobody can find the person</li><li><b>B.</b> No: the hash is a pseudonym and the quasi-identifiers still single people out</li><li><b>C.</b> Yes, as long as it stays on the university's servers</li><li><b>D.</b> No, but only because names were in the original table</li></ul></li>
<li><p>Bashayer wants applicants per district on a public dashboard, refreshed every month. Some districts have fewer than ten applicants a month. Which control fits best?</p><ul><li><b>A.</b> Pseudonymise the applicant numbers before counting</li><li><b>B.</b> Suppress every count below ten each month</li><li><b>C.</b> Publish a synthetic extract instead of counts</li><li><b>D.</b> Add calibrated noise under a stated yearly privacy budget</li></ul></li>
<li><p>Release A links 99% of the register's applicants on birth date, gender and postcode. Waad needs household size and approval by region. Which single change cuts the links most while keeping her question answerable?</p><ul><li><b>A.</b> Replace the birth date with an age band</li><li><b>B.</b> Remove gender</li><li><b>C.</b> Replace the study code with a new random code</li><li><b>D.</b> Round income to the nearest 1,000 riyals</li></ul></li>
<li><p>Release B and release C both have k = 1. B has 2,152 unique records and C has 7. Yahya asks whether they are equally risky. What do you tell him?</p><ul><li><b>A.</b> Yes: both have k = 1, so both expose someone</li><li><b>B.</b> B is safer because its birth year and district are more precise</li><li><b>C.</b> C is far safer, but neither meets k of five until the small classes are treated</li><li><b>D.</b> C is safe to release as it is, since seven records is negligible</li></ul></li>
<li><p>Yusr replaces each national identifier in a research extract with a salted hash. The data protection officer keeps the salt. The researcher asks whether the extract is still personal data.</p><ul><li><b>A.</b> No: the recipient cannot reverse a salted hash</li><li><b>B.</b> Yes: the fund can relink it, so it is still personal data</li><li><b>C.</b> No: once direct identifiers are gone the data are anonymous</li><li><b>D.</b> Only if the hash had been computed without a salt</li></ul></li>
<li><p>The board wants to publish approved applications per district each quarter, including districts with fewer than ten applicants. Which control fits, and what does it cost?</p><ul><li><b>A.</b> Differential privacy; small districts get noisier figures</li><li><b>B.</b> Pseudonymisation of the counts; nothing is lost</li><li><b>C.</b> k-anonymity on the published table; rows can still be linked</li><li><b>D.</b> A synthetic copy of the table; the counts stay exact</li></ul></li>
<li><p>A university requests an extract of 40,000 applicants with region, five-year age band, household size and support status, treated to k = 5. Under the Data Classification Policy, at what level does it stay?</p><ul><li><b>A.</b> Public, because k = 5 makes it anonymous</li><li><b>B.</b> Secret, because it concerns social support</li><li><b>C.</b> No level, because de-identified data are outside the policy</li><li><b>D.</b> Restricted, as personal data about individuals</li></ul></li>
<li><p>A university researcher emails Yusr directly to ask for applicant records for her study. Under the General Rules for Secondary Use of Data, what is missing?</p><ul><li><b>A.</b> Nothing: research is a legitimate purpose, so her email request is enough</li><li><b>B.</b> A public release of the records first, so that anyone may use them</li><li><b>C.</b> A request via her institution with written approval, for minimum data</li><li><b>D.</b> Only encryption of the file when it is sent</li></ul></li>
<li><p>Release A drops names and national identifiers but keeps birth date, gender and postcode. A public register lists names with the same three fields. A join re-identifies 99.2% of the register's applicants. Why?</p><ul><li><b>A.</b> Together the three fields are unique for almost everyone</li><li><b>B.</b> The register also holds the applicants' national identifiers</li><li><b>C.</b> The postcode alone points to one applicant</li><li><b>D.</b> The test must be wrong, since linkage needs exact names</li></ul></li>
<li><p>In candidate release B, 2,152 records are unique on the quasi-identifiers. What is k for release B, and what does it say?</p><ul><li><b>A.</b> k = 2,152: the number of records at risk</li><li><b>B.</b> k = 1: at least one record can be singled out on these fields</li><li><b>C.</b> k is unknown until a linkage test is run</li><li><b>D.</b> k = 1, so every single record in release B is unique</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Release with less risk</h2>
<ol>
<li><p>Yesterday three fields linked 99.2% of the register's applicants to their income and decision. Yahya asks what the attacker had to have. Which answer is right?</p><ul><li><b>A.</b> The key that maps study codes back to applicants</li><li><b>B.</b> At least one direct identifier left in the release</li><li><b>C.</b> An outside file sharing birth date, gender and postcode with the release</li><li><b>D.</b> The applicants' incomes, to match them to the release</li></ul></li>
<li><p>At five-year band and district, 1,728 records (2.9%) are below five. Waad wants to keep the district. Malak can suppress those 1,728 or move to region and suppress 293. What should she weigh?</p><ul><li><b>A.</b> Which small groups the 1,728 are, and whether Waad's question needs the district</li><li><b>B.</b> Always the option with fewer suppressed records</li><li><b>C.</b> Always suppression, since it leaves every kept record exact</li><li><b>D.</b> Whichever option gives the higher k</li></ul></li>
<li><p>Malak releases the 59 district counts at epsilon 0.1 instead of 0.5. Bashayer asks what changed. Which statement is right?</p><ul><li><b>A.</b> The large districts now carry most of the error</li><li><b>B.</b> The counts are now private, where before they were not</li><li><b>C.</b> The noise is 59 times larger, one share per district</li><li><b>D.</b> Each count's noise is about five times larger, and the guarantee is stronger</li></ul></li>
<li><p>Malak releases applicants per region, 13 counts, each with noise of scale 10 (epsilon 0.1 for a count). Every applicant is in exactly one region. What has the release spent?</p><ul><li><b>A.</b> 1.3, the sum over the 13 regions</li><li><b>B.</b> 0.1, because the regions hold disjoint applicants</li><li><b>C.</b> About 0.008, a thirteenth of 0.1</li><li><b>D.</b> Nothing, since counts are aggregates</li></ul></li>
<li><p>A vendor's synthetic file matches the real one on utility. No row is an exact copy, and 31% of its rows are closer to the training data than to a holdout. What do you conclude?</p><ul><li><b>A.</b> Nothing blocks it on these tests: no copies, and no preference for training rows</li><li><b>B.</b> It leaks: 31% of rows sit next to training records</li><li><b>C.</b> It is too accurate to be private, so it must be copying</li><li><b>D.</b> It is differentially private, since no row is copied</li></ul></li>
<li><p>To reach k = 5, node (a) uses five-year birth bands and region and suppresses 293 records; node (b) uses ten-year bands and region and suppresses 84. The study asks how approval varies with age. What do you choose and report?</p><ul><li><b>A.</b> (b), because fewer suppressed records always means more utility</li><li><b>B.</b> (a), without mentioning the suppressed records, since k is met</li><li><b>C.</b> Neither: k = 5 needs the age field removed entirely</li><li><b>D.</b> (a), reporting the suppressed records and the change by age</li></ul></li>
<li><p>After treatment k = 5, but in one class all five records have disability in household = yes. A recipient knows her neighbour is in that class. What has the treatment failed to prevent?</p><ul><li><b>A.</b> Identity disclosure: she can now find her neighbour's exact record</li><li><b>B.</b> Nothing, since k = 5 protects every attribute</li><li><b>C.</b> Attribute disclosure: she learns the status without the record</li><li><b>D.</b> Membership inference, which arises only in synthetic data</li></ul></li>
<li><p>Yusr releases district counts with differential privacy at epsilon 0.5. What does this promise each applicant?</p><ul><li><b>A.</b> Their record is removed from the data before the counts are made</li><li><b>B.</b> No count is off by more than 0.5</li><li><b>C.</b> No one can learn anything about their district</li><li><b>D.</b> The counts are almost as likely with or without their record</li></ul></li>
<li><p>A count per district is released with the Laplace mechanism. Each applicant is in exactly one district. At epsilon 0.5, what is the noise scale?</p><ul><li><b>A.</b> 0.5: the scale equals epsilon</li><li><b>B.</b> 2: sensitivity 1 divided by epsilon 0.5</li><li><b>C.</b> 1: the scale equals the sensitivity</li><li><b>D.</b> 0.25: sensitivity times epsilon</li></ul></li>
<li><p>Over a year the fund releases four tables about the same applicants at epsilon 0.1, 0.2, 0.2 and 0.5. What is the total privacy loss?</p><ul><li><b>A.</b> 1.0: releases about the same people add up</li><li><b>B.</b> 0.5: the largest of the four</li><li><b>C.</b> 0.25: their average</li><li><b>D.</b> 0.1: the smallest, because it protects the most</li></ul></li>
<li><p>District counts at epsilon 0.1, 0.5 and 1 give a mean error of 9.98, 1.92 and 0.85, and a relative error in the ten smallest districts of 16%, 3.1% and 1.5%. The dashboard must keep small districts within about 5%. Which budget do you recommend?</p><ul><li><b>A.</b> 0.1, because the smallest budget is always the safest choice</li><li><b>B.</b> 1, because its error is the lowest</li><li><b>C.</b> 0.5: the smallest budget that meets the need in small districts</li><li><b>D.</b> Any of them, since all mean errors are below 10</li></ul></li>
<li><p>Bashayer says: "The hackathon file is synthetic, so no applicant can be in it." What do you answer?</p><ul><li><b>A.</b> She is right: synthetic rows are invented by definition</li><li><b>B.</b> A generator can copy training rows, so leakage is tested first</li><li><b>C.</b> She is right if the file has as many rows as the original</li><li><b>D.</b> Only a differentially private generator may ever be released at all</li></ul></li>
<li><p>0.10% of synthetic rows match a training record exactly, and 0.05% match a record from a holdout the generator never saw. What does this suggest?</p><ul><li><b>A.</b> The file leaks, because any exact copy is a leak</li><li><b>B.</b> The holdout comparison means nothing, since the generator never saw it</li><li><b>C.</b> Utility is too low, because so few rows match real ones</li><li><b>D.</b> Copies are close to the rate of chance matches seen on the holdout</li></ul></li>
<li><p>A membership-inference test gives AUC 0.819 for a generator with leaves of one row, and 0.511 with leaves of 200 rows. What do you conclude?</p><ul><li><b>A.</b> With leaves of 200, an attacker does little better than chance</li><li><b>B.</b> Leaves of one are better, since a higher AUC means more utility</li><li><b>C.</b> Neither can be released, since any AUC above 0.5 is leakage</li><li><b>D.</b> Nothing, since AUC measures the attack, not the file</li></ul></li>
<li><p>The leaf-200 file copies 0.10% of rows (holdout 0.05%), membership AUC 0.511, and a model trained on it reaches AUC 0.933 against 0.936 on real data. The hackathon will train models. What do you recommend?</p><ul><li><b>A.</b> Release the leaf-one file, which reproduces the real data more closely</li><li><b>B.</b> Release this file and stop running the tests, since they passed once</li><li><b>C.</b> Release this file with its leakage tests and generator settings documented</li><li><b>D.</b> Hold it until its utility matches the real data exactly</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Audit for fairness</h2>
<ol>
<li><p>Bashayer approves the district counts at epsilon 0.5 and asks for them every month. Yahya asks what the fund will have spent after a year.</p><ul><li><b>A.</b> 0.5, because each month is a separate table</li><li><b>B.</b> 6, because the same applicants are counted twelve times</li><li><b>C.</b> 0.5, because later months are post-processing</li><li><b>D.</b> About 0.04, a twelfth of 0.5</li></ul></li>
<li><p>Hail has an FNR of 18.2% from 110 eligible applicants, interval 12.1% to 26.4%. The FNR over all 6,341 eligible applicants is 22.8%. Wiam asks whether Ahliya treats Hail's applicants better.</p><ul><li><b>A.</b> Yes: 18.2% is lower than 22.8%, so Hail is treated better</li><li><b>B.</b> Nothing at all, since 110 applicants is too few to compute a rate</li><li><b>C.</b> No difference is shown: the interval includes the overall rate</li><li><b>D.</b> No: small regions are always disadvantaged by the model</li></ul></li>
<li><p>Ahliya decides who is passed to an officer for housing support. Eligible applicants are more common among women. Bashayer asks which fairness criterion the fund should commit to.</p><ul><li><b>A.</b> Equal false negative rates: miss eligible applicants equally in each group</li><li><b>B.</b> Equal selection rates: pass the same share of women and men</li><li><b>C.</b> All three criteria at once, to be safe</li><li><b>D.</b> None: Ahliya does not use gender, so it is fair</li></ul></li>
<li><p>Self-employed applicants are missed by Ahliya far more often. An income audit shows their recorded income is 1.73 times the verified income; for employees it is 1.00. Which type fits, and what is the first fix?</p><ul><li><b>A.</b> Labeling Bias: retrain on corrected decisions</li><li><b>B.</b> Sampling Bias: reweight the self-employed in training</li><li><b>C.</b> Historical Bias: retrain on recent applications only</li><li><b>D.</b> Measurement Bias: record net income for the self-employed</li></ul></li>
<li><p>Reweighting moved the FNR gap from 12.9 to 12.6 points. Group thresholds moved it to 10.0, at the same accuracy. The gap comes mostly from missing and mis-recorded income. What do you recommend to Bashayer?</p><ul><li><b>A.</b> Group thresholds as the permanent fix, since accuracy did not fall</li><li><b>B.</b> Fix income recording first; thresholds only as an approved interim measure</li><li><b>C.</b> Reweighting, because pre-processing is always preferable</li><li><b>D.</b> Neither, since the gap is not closed completely</li></ul></li>
<li><p>In Al-Jouf, 4 non-Saudi women were eligible and the screen declined 3. How should the audit report this cell?</p><ul><li><b>A.</b> As a false negative rate of 75%, the highest in the audit</li><li><b>B.</b> As too few to estimate, with the count of 4</li><li><b>C.</b> Merged with Saudi women in Al-Jouf, without saying so</li><li><b>D.</b> Not at all: the region is dropped from the report</li></ul></li>
<li><p>Forcing equal selection rates for women and men opened a 12.4-point gap in their false negative rates. For a decision on housing support, which criterion fits?</p><ul><li><b>A.</b> Equal false negative rates: the harm is missing eligible people</li><li><b>B.</b> Equal selection rates, which is what fairness means</li><li><b>C.</b> Equal precision, since every approved applicant must be eligible</li><li><b>D.</b> All three at once, by tuning the threshold carefully</li></ul></li>
<li><p>Self-employed applicants' recorded income is 1.5 to 2 times their verified income, and the screen declines more than half of the eligible self-employed. Which bias type of the national AI Bias Reference Guide does this match?</p><ul><li><b>A.</b> Historical bias</li><li><b>B.</b> Sampling bias</li><li><b>C.</b> Feedback loop bias</li><li><b>D.</b> Measurement bias</li></ul></li>
<li><p>Group thresholds narrow the false negative gap from 12.9 to 10.0 points at the same accuracy. What must accompany them before deployment?</p><ul><li><b>A.</b> Nothing, since accuracy did not fall</li><li><b>B.</b> Reweighting first, since post-processing is not allowed</li><li><b>C.</b> Approval to use gender and nationality, and an income fix</li><li><b>D.</b> Removing gender and nationality, so the rule cannot be challenged</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Document and assess</h2>
<ol>
<li><p>Anmar reports that eligible women and men are missed at 22.7% and 22.8%. He proposes to close the audit.</p><ul><li><b>A.</b> Not shown: the intersection of gender and nationality must be checked too</li><li><b>B.</b> Yes: equal false negative rates by gender meet equal opportunity</li><li><b>C.</b> No: the selection rates by gender must also be equal</li><li><b>D.</b> Not until every region by gender by nationality cell is estimated</li></ul></li>
<li><p>Malak's draft says: "k = 5 was reached, so the extract is anonymous and no risk remains." Yahya sends it back.</p><ul><li><b>A.</b> That k should be raised to 10 before release</li><li><b>B.</b> That the sharing agreement makes residual risk irrelevant</li><li><b>C.</b> That 99.2% of applicants can still be linked</li><li><b>D.</b> The risks k does not cover, and that the extract is still personal data</li></ul></li>
<li><p>Anmar's card has all seven sections. Its results table shows gender and region, each with intervals. Wiam rejects it.</p><ul><li><b>A.</b> The card omits the validation report's 88.1%</li><li><b>B.</b> It does not estimate every region by gender cell</li><li><b>C.</b> It hides the largest gap, which is in gender by nationality</li><li><b>D.</b> The gap is not closed, so the card cannot be filed</li></ul></li>
<li><p>Malak scores R2's likelihood as 2, "unlikely", because officers can overturn Ahliya. The audit measured 1,444 of 6,341 eligible applicants declined by the screen.</p><ul><li><b>A.</b> 2 is right, since officers review every decision</li><li><b>B.</b> 4: the harm is measured now, without an effective control</li><li><b>C.</b> 3, so that the level does not reach the catastrophic band</li><li><b>D.</b> 1, because the gender gap is only 0.1 points</li></ul></li>
<li><p>A peer reports an FNR gap of -2.9 points; your rerun on all rows at 0.5 gives -0.2. The bootstrap is unseeded, the threshold is 0.45, and 633 rows with missing income are dropped.</p><ul><li><b>A.</b> The dropped rows: removing them alone takes the gap from +0.6 to -2.9</li><li><b>B.</b> The unseeded bootstrap, because each run differs</li><li><b>C.</b> The threshold of 0.45, because it differs from the documented 0.5</li><li><b>D.</b> A different pandas version on the peer's machine</li></ul></li>
<li><p>Malak fills the datasheet's De-identification section from her notebook's last run, which suppressed 290 records. The release log says 293. What should she write?</p><ul><li><b>A.</b> 290, since it is the more recent run</li><li><b>B.</b> 293, the number in the log of the released run</li><li><b>C.</b> 291.5, the average, with a note on uncertainty</li><li><b>D.</b> No number, since a difference of three does not matter</li></ul></li>
<li><p>The vendor reports 88.1% accuracy against officers' decisions in two regions; against the reviewed outcome of 12,000 applications it is 84.8%. What goes in the model card?</p><ul><li><b>A.</b> 88.1%, since it is the figure the model was approved on</li><li><b>B.</b> Both, without comment, so readers choose</li><li><b>C.</b> Neither, since accuracy says nothing about fairness</li><li><b>D.</b> 84.8%, and why the vendor's 88.1% is not used</li></ul></li>
<li><p>Risk R2 (wrongful declines) scores likelihood 4 and impact 3. After adding officer review of every decline, Anmar rescores it as likelihood 2 and impact 1. Wiam rejects the new impact. Why?</p><ul><li><b>A.</b> Review lowers the chance of a wrong decision, not the harm when one happens</li><li><b>B.</b> A residual cannot be scored until the treatment has run for a year</li><li><b>C.</b> A high risk can only be avoided, never mitigated</li><li><b>D.</b> Likelihood can never fall after a measured harm</li></ul></li>
<li><p>A peer's script reproduces their claimed gap exactly. Your review finds it drops 633 rows with missing income, 65% of them women, and the README does not say so. What do you record?</p><ul><li><b>A.</b> Nothing: a result that reproduces is confirmed</li><li><b>B.</b> Only that the result is not reproducible</li><li><b>C.</b> The filter, its place, its effect on the gap, and the fix</li><li><b>D.</b> That missing values should be dropped in every analysis they run</li></ul></li>
</ol>
</section>

fiers recomputes the same hashes","","Confuses who holds the data with what the data is: the extract identifies people wherever it sits","Thinks names are the only identifier: birth date, gender and postcode do the identifying here"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-hashed-id","title":"Is the hashed extract still personal data?"},"level":null,"pool":"checkpoint"},{"id":"check-control-q1","type":"single","prompt":"Bashayer wants applicants per district on a public dashboard, refreshed every month. Some districts have fewer than ten applicants a month. Which control fits best?","options":[{"key":"A","text":"Pseudonymise the applicant numbers before counting"},{"key":"B","text":"Suppress every count below ten each month"},{"key":"C","text":"Publish a synthetic extract instead of counts"},{"key":"D","text":"Add calibrated noise under a stated yearly privacy budget"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Differential privacy bounds what any one applicant changes in every release, and the budget makes the cost of monthly repetition explicit.","misconceptions":["Thinks a code protects published numbers: pseudonymisation applies to rows, not to counts","Assumes suppression is free when repeated: monthly tables with suppressed cells can be differenced against each other","Uses a row-level control for an aggregate need, and gives up the counts the dashboard is for",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-control","title":"Which control fits the monthly dashboard?"},"level":null,"pool":"checkpoint"},{"id":"check-which-field-q1","type":"single","prompt":"Release A links 99% of the register's applicants on birth date, gender and postcode. Waad needs household size and approval by region. Which single change cuts the links most while keeping her question answerable?","options":[{"key":"A","text":"Replace the birth date with an age band"},{"key":"B","text":"Remove gender"},{"key":"C","text":"Replace the study code with a new random code"},{"key":"D","text":"Round income to the nearest 1,000 riyals"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The birth date has by far the most values of the three fields; coarsening it collapses the combinations, and the question needs only an age band.","misconceptions":["","Removes a field that has only two values: gender splits each class in half and barely changes uniqueness","Thinks the code is what links: the study code was never part of the join","Protects a sensitive attribute, not an identifier: linkage uses the quasi-identifiers, not the income"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-which-field","title":"Which change stops most of the links?"},"level":null,"pool":"checkpoint"},{"id":"check-k-q1","type":"single","prompt":"Release B and release C both have k = 1. B has 2,152 unique records and C has 7. Yahya asks whether they are equally risky. What do you tell him?","options":[{"key":"A","text":"Yes: both have k = 1, so both expose someone"},{"key":"B","text":"B is safer because its birth year and district are more precise"},{"key":"C","text":"C is far safer, but neither meets k of five until the small classes are treated"},{"key":"D","text":"C is safe to release as it is, since seven records is negligible"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"k reports only the worst class. The count of unique records and the average risk show that C exposes 7 people and B exposes 2,152, yet both still fail the target.","misconceptions":["Reads k as the whole story: k is only the smallest class, so it hides how many people are exposed","Confuses detail kept for the analysis with protection: finer birth and place values split classes and raise the risk","","Treats seven people as negligible: each of them is certainly re-identified by anyone who knows them"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-k","title":"Which release is safer?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Yesterday three fields linked 99.2% of the register's applicants to their income and decision. Yahya asks what the attacker had to have. Which answer is right?","options":[{"key":"A","text":"The key that maps study codes back to applicants"},{"key":"B","text":"At least one direct identifier left in the release"},{"key":"C","text":"An outside file sharing birth date, gender and postcode with the release"},{"key":"D","text":"The applicants' incomes, to match them to the release"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A linkage attack needs only quasi-identifiers that an outside file shares with the release; the names come from the outside file.","misconceptions":["Assumes re-identification needs the fund's secrets: the study code was never used in the join","Thinks only direct identifiers re-identify: no name or national identifier was in the release","","Confuses the harm with the means: income is what the link revealed, not what it used"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"What did the linkage attack actually need?"},"level":null,"pool":"checkpoint"},{"id":"check-suppress-q1","type":"single","prompt":"At five-year band and district, 1,728 records (2.9%) are below five. Waad wants to keep the district. Malak can suppress those 1,728 or move to region and suppress 293. What should she weigh?","options":[{"key":"A","text":"Which small groups the 1,728 are, and whether Waad's question needs the district"},{"key":"B","text":"Always the option with fewer suppressed records"},{"key":"C","text":"Always suppression, since it leaves every kept record exact"},{"key":"D","text":"Whichever option gives the higher k"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Both meet k of five. The choice is about utility: what the question needs, and whose records the suppression removes.","misconceptions":["","Thinks the least suppression always wins: it ignores what the question needs","Thinks suppression is free because rows are simply removed: they are the rare groups, so estimates for them shift","Confuses the target with a preference: k of five is met either way, so k cannot decide it"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-suppress","title":"Suppress more, or generalise more?"},"level":null,"pool":"checkpoint"},{"id":"check-epsilon-q1","type":"single","prompt":"Malak releases the 59 district counts at epsilon 0.1 instead of 0.5. Bashayer asks what changed. Which statement is right?","options":[{"key":"A","text":"The large districts now carry most of the error"},{"key":"B","text":"The counts are now private, where before they were not"},{"key":"C","text":"The noise is 59 times larger, one share per district"},{"key":"D","text":"Each count's noise is about five times larger, and the guarantee is stronger"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The scale is sensitivity over epsilon: going from 0.5 to 0.1 multiplies it by five, and a smaller epsilon bounds any one applicant's influence more tightly.","misconceptions":["Thinks noise grows with the count: the noise scale is set by sensitivity and epsilon, not by the district's size","Thinks privacy is binary: every epsilon gives a guarantee, a smaller one is a stronger one","Confuses the sensitivity with the number of counts: one person changes one count, whatever the number of districts",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-epsilon","title":"What does a smaller epsilon buy?"},"level":null,"pool":"checkpoint"},{"id":"check-parallel-q1","type":"single","prompt":"Malak releases applicants per region, 13 counts, each with noise of scale 10 (epsilon 0.1 for a count). Every applicant is in exactly one region. What has the release spent?","options":[{"key":"A","text":"1.3, the sum over the 13 regions"},{"key":"B","text":"0.1, because the regions hold disjoint applicants"},{"key":"C","text":"About 0.008, a thirteenth of 0.1"},{"key":"D","text":"Nothing, since counts are aggregates"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Parallel composition: one applicant affects only one region's count, so the release spends the epsilon of one count.","misconceptions":["Adds epsilons over disjoint groups: sequential composition applies only to releases about the same people","","Divides the budget instead of adding it: splitting into regions does not make each count cheaper","Thinks counts are free because they are aggregates: every noisy count spends budget"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-parallel","title":"How much did the region counts spend?"},"level":null,"pool":"checkpoint"},{"id":"check-synthetic-q1","type":"single","prompt":"A vendor's synthetic file matches the real one on utility. No row is an exact copy, and 31% of its rows are closer to the training data than to a holdout. What do you conclude?","options":[{"key":"A","text":"Nothing blocks it on these tests: no copies, and no preference for training rows"},{"key":"B","text":"It leaks: 31% of rows sit next to training records"},{"key":"C","text":"It is too accurate to be private, so it must be copying"},{"key":"D","text":"It is differentially private, since no row is copied"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Leakage shows as more closeness to training rows than to unseen rows. 31% is below the 50% of no preference, and no row is copied.","misconceptions":["","Reads any share below 100% as leakage: the warning sign is a share well above 50%, not below it","Treats high utility as a leak in itself: utility is a warning only when copies or membership show memorising","Thinks no copies means a formal guarantee: these tests are evidence against one attack, not a proof"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-synthetic","title":"Which result should block the release?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Bashayer approves the district counts at epsilon 0.5 and asks for them every month. Yahya asks what the fund will have spent after a year.","options":[{"key":"A","text":"0.5, because each month is a separate table"},{"key":"B","text":"6, because the same applicants are counted twelve times"},{"key":"C","text":"0.5, because later months are post-processing"},{"key":"D","text":"About 0.04, a twelfth of 0.5"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Sequential composition: twelve releases about the same people spend twelve times 0.5.","misconceptions":["Applies parallel composition across months: the months are about the same applicants, so the epsilons add","","Thinks post-processing covers new releases: each month is a new measurement on the data, not a computation on last month's output","Divides instead of adding: splitting a budget into months is a choice, not what happens by default"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"A monthly dashboard at epsilon 0.5: what is spent in a year?"},"level":null,"pool":"checkpoint"},{"id":"check-interval-q1","type":"single","prompt":"Hail has an FNR of 18.2% from 110 eligible applicants, interval 12.1% to 26.4%. The FNR over all 6,341 eligible applicants is 22.8%. Wiam asks whether Ahliya treats Hail's applicants better.","options":[{"key":"A","text":"Yes: 18.2% is lower than 22.8%, so Hail is treated better"},{"key":"B","text":"Nothing at all, since 110 applicants is too few to compute a rate"},{"key":"C","text":"No difference is shown: the interval includes the overall rate"},{"key":"D","text":"No: small regions are always disadvantaged by the model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval from 12.1% to 26.4% contains 22.8%, so the data do not show that Hail differs.","misconceptions":["Reads a point estimate without its interval: the interval includes the overall rate","Treats a wide interval as no information: it still rules out very high or very low rates","","Confuses a smaller group with a worse outcome: size widens the interval, it does not move the rate"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-interval","title":"What can the audit say about Hail?"},"level":null,"pool":"checkpoint"},{"id":"check-criterion-q1","type":"single","prompt":"Ahliya decides who is passed to an officer for housing support. Eligible applicants are more common among women. Bashayer asks which fairness criterion the fund should commit to.","options":[{"key":"A","text":"Equal false negative rates: miss eligible applicants equally in each group"},{"key":"B","text":"Equal selection rates: pass the same share of women and men"},{"key":"C","text":"All three criteria at once, to be safe"},{"key":"D","text":"None: Ahliya does not use gender, so it is fair"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The harmful error in a support decision is the missed eligible applicant, and need differs between groups, so error rates among the eligible are what must be equal.","misconceptions":["","Ignores the different need: equal selection would decline eligible women to match men's rate","Thinks all criteria can be met together: with different base rates they conflict","Equates removing an input with fair outcomes: outcomes still differ through other features"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-criterion","title":"Which criterion for a support decision?"},"level":null,"pool":"checkpoint"},{"id":"check-bias-type-q1","type":"single","prompt":"Self-employed applicants are missed by Ahliya far more often. An income audit shows their recorded income is 1.73 times the verified income; for employees it is 1.00. Which type fits, and what is the first fix?","options":[{"key":"A","text":"Labeling Bias: retrain on corrected decisions"},{"key":"B","text":"Sampling Bias: reweight the self-employed in training"},{"key":"C","text":"Historical Bias: retrain on recent applications only"},{"key":"D","text":"Measurement Bias: record net income for the self-employed"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The feature itself is systematically over-recorded for one group, which is the guide's measurement bias; the fix is at the point of recording.","misconceptions":["Blames the outcome when the evidence points at a feature: the officers applied the rule correctly to the income they were given","Reaches for a mitigation that cannot repair a wrong input: weights change counts, not recorded incomes","Treats every old pattern as historical: nothing here changed over time",""],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-bias-type","title":"Measurement or labelling?"},"level":null,"pool":"checkpoint"},{"id":"check-mitigation-q1","type":"single","prompt":"Reweighting moved the FNR gap from 12.9 to 12.6 points. Group thresholds moved it to 10.0, at the same accuracy. The gap comes mostly from missing and mis-recorded income. What do you recommend to Bashayer?","options":[{"key":"A","text":"Group thresholds as the permanent fix, since accuracy did not fall"},{"key":"B","text":"Fix income recording first; thresholds only as an approved interim measure"},{"key":"C","text":"Reweighting, because pre-processing is always preferable"},{"key":"D","text":"Neither, since the gap is not closed completely"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The cause is in the income feature, so the lasting fix is at the source; the threshold change helps meanwhile but needs approval because it uses gender and nationality.","misconceptions":["Reads an unchanged accuracy as a free fix: the rule uses protected attributes and the gap remains","","Ignores what the evidence showed: the weights cannot repair a wrong feature","Treats an unfinished fix as no fix: a narrowed gap with monitoring is better than the baseline"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-mitigation","title":"Which mitigation would you recommend?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Anmar reports that eligible women and men are missed at 22.7% and 22.8%. He proposes to close the audit.","options":[{"key":"A","text":"Not shown: the intersection of gender and nationality must be checked too"},{"key":"B","text":"Yes: equal false negative rates by gender meet equal opportunity"},{"key":"C","text":"No: the selection rates by gender must also be equal"},{"key":"D","text":"Not until every region by gender by nationality cell is estimated"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Non-Saudi women are missed at 29.8%, which the gender margin hides.","misconceptions":["","Reads equal margins as equal treatment: a gap inside an intersection can cancel out in both margins","Moves to a criterion the course did not choose: for support by need, the harm is the missed eligible applicant","Treats every slice as required: cells below the minimum of 30 eligible are reported as too few, not audited"],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Gender alone shows no gap. Is Ahliya fair?"},"level":null,"pool":"checkpoint"},{"id":"check-datasheet-q1","type":"single","prompt":"Malak's draft says: \"k = 5 was reached, so the extract is anonymous and no risk remains.\" Yahya sends it back.","options":[{"key":"A","text":"That k should be raised to 10 before release"},{"key":"B","text":"That the sharing agreement makes residual risk irrelevant"},{"key":"C","text":"That 99.2% of applicants can still be linked"},{"key":"D","text":"The risks k does not cover, and that the extract is still personal data"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"k limits singling out on the chosen quasi-identifiers only; attribute disclosure and other files remain, and the data stay Restricted.","misconceptions":["Moves the problem to a number: a larger k narrows linkage risk but still says nothing about classes that share one value","Confuses documentation with access control: the agreement limits use, it does not remove the risk the datasheet must state","Reports the before-treatment figure as if it remained: no register record matched one record after treatment",""],"lo":["LO6"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-datasheet","title":"What must the residual risk section say?"},"level":null,"pool":"checkpoint"},{"id":"check-card-q1","type":"single","prompt":"Anmar's card has all seven sections. Its results table shows gender and region, each with intervals. Wiam rejects it.","options":[{"key":"A","text":"The card omits the validation report's 88.1%"},{"key":"B","text":"It does not estimate every region by gender cell"},{"key":"C","text":"It hides the largest gap, which is in gender by nationality"},{"key":"D","text":"The gap is not closed, so the card cannot be filed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Non-Saudi women are missed at 29.8%; margins by gender and region alone do not show it.","misconceptions":["Asks for a figure the card already handles: the vendor's number is named and explained, not required","Asks for more rows than the data support: small cells are reported as too few, not filled","","Reads the absence of a fix as a defect of the card: the card records the mitigation, it does not have to close the gap"],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-card","title":"A card that passes every section check"},"level":null,"pool":"checkpoint"},{"id":"check-likelihood-q1","type":"single","prompt":"Malak scores R2's likelihood as 2, \"unlikely\", because officers can overturn Ahliya. The audit measured 1,444 of 6,341 eligible applicants declined by the screen.","options":[{"key":"A","text":"2 is right, since officers review every decision"},{"key":"B","text":"4: the harm is measured now, without an effective control"},{"key":"C","text":"3, so that the level does not reach the catastrophic band"},{"key":"D","text":"1, because the gender gap is only 0.1 points"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Likelihood is argued from exposure and the controls in place; the harm is already measured and auto-declines bypass review.","misconceptions":["Counts a control that is not in place: 37.4% of applications are auto-declined and never seen by an officer","","Lowers the likelihood because the impact is high: the two scores are argued separately","Scores on fairness instead of harm: likelihood asks how probable the harm is, not whether groups differ"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-likelihood","title":"How likely is a harm that is already happening?"},"level":null,"pool":"checkpoint"},{"id":"check-review-q1","type":"single","prompt":"A peer reports an FNR gap of -2.9 points; your rerun on all rows at 0.5 gives -0.2. The bootstrap is unseeded, the threshold is 0.45, and 633 rows with missing income are dropped.","options":[{"key":"A","text":"The dropped rows: removing them alone takes the gap from +0.6 to -2.9"},{"key":"B","text":"The unseeded bootstrap, because each run differs"},{"key":"C","text":"The threshold of 0.45, because it differs from the documented 0.5"},{"key":"D","text":"A different pandas version on the peer's machine"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"At the peer's threshold, keeping the rows gives +0.6; dropping them gives -2.9, because they are mostly women Ahliya misses.","misconceptions":["","Blames the visible randomness: an unseeded bootstrap moves the interval, not the point estimate","Picks the documented mismatch: at all rows, 0.45 against 0.5 moves the gap by under one point","Assumes environments explain differences: the same code on the same data reproduced the claim exactly"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-review","title":"Which gap explains the different number?"},"level":null,"pool":"checkpoint"},{"id":"q-privacy-01","type":"single","prompt":"Yusr replaces each national identifier in a research extract with a salted hash. The data protection officer keeps the salt. The researcher asks whether the extract is still personal data.","options":[{"key":"A","text":"No: the recipient cannot reverse a salted hash"},{"key":"B","text":"Yes: the fund can relink it, so it is still personal data"},{"key":"C","text":"No: once direct identifiers are gone the data are anonymous"},{"key":"D","text":"Only if the hash had been computed without a salt"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data can be linked back with information the fund holds, so the national anonymisation guideline treats it as personal data.","misconceptions":["Treats one-way hashing as anonymisation; the fund can still relink, and other fields still single people out","","Ignores both the key the fund keeps and the quasi-identifiers left in the rows","Thinks the salt changes the legal status; it slows guessing, it does not stop the fund relinking"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"pseudonym-still-personal","title":"A pseudonymised extract is still personal data"},"level":"understand","pool":"practice"},{"id":"q-privacy-02","type":"single","prompt":"The board wants to publish approved applications per district each quarter, including districts with fewer than ten applicants. Which control fits, and what does it cost?","options":[{"key":"A","text":"Differential privacy; small districts get noisier figures"},{"key":"B","text":"Pseudonymisation of the counts; nothing is lost"},{"key":"C","text":"k-anonymity on the published table; rows can still be linked"},{"key":"D","text":"A synthetic copy of the table; the counts stay exact"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Counts are aggregates; differential privacy bounds what one applicant changes, and the price is noise that matters most where counts are small.","misconceptions":["","Applies a record-level control to a table of counts, where there is no identifier to replace","Applies a microdata control to aggregates, and misstates what it leaves behind","Expects exact counts from synthetic data, which neither keeps them exact nor bounds the risk"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"match-control","title":"The use decides the control, and the control decides the risk left"},"level":"apply","pool":"practice"},{"id":"q-privacy-03","type":"single","prompt":"A university requests an extract of 40,000 applicants with region, five-year age band, household size and support status, treated to k = 5. Under the Data Classification Policy, at what level does it stay?","options":[{"key":"A","text":"Public, because k = 5 makes it anonymous"},{"key":"B","text":"Secret, because it concerns social support"},{"key":"C","text":"No level, because de-identified data are outside the policy"},{"key":"D","text":"Restricted, as personal data about individuals"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The policy lists personal data under Restricted; de-identification lowers the risk but the extract remains personal data.","misconceptions":["Thinks a treatment changes the class; it lowers the risk of the data, which are still about people","Over-classifies: the harm of disclosure does not reach the level the Secret class describes","Thinks some data escape classification; every data asset gets a level",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"three-extracts","title":"Three extracts, three levels, three answers to \"may it leave?\""},"level":"apply","pool":"practice"},{"id":"q-privacy-04","type":"single","prompt":"A university researcher emails Yusr directly to ask for applicant records for her study. Under the General Rules for Secondary Use of Data, what is missing?","options":[{"key":"A","text":"Nothing: research is a legitimate purpose, so her email request is enough"},{"key":"B","text":"A public release of the records first, so that anyone may use them"},{"key":"C","text":"A request via her institution with written approval, for minimum data"},{"key":"D","text":"Only encryption of the file when it is sent"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The rules route a researcher's request through her institution with written approval, and limit the data to what the purpose needs.","misconceptions":["Takes a legitimate purpose as the only condition; the route and the minimum data matter too","Confuses secondary use under conditions with open data","","Treats a transfer safeguard as the permission to use the data"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"secondary-use-conditions","title":"A research extract leaves under conditions, not because names are gone"},"level":"analyze","pool":"practice"},{"id":"q-privacy-05","type":"single","prompt":"Release A drops names and national identifiers but keeps birth date, gender and postcode. A public register lists names with the same three fields. A join re-identifies 99.2% of the register's applicants. Why?","options":[{"key":"A","text":"Together the three fields are unique for almost everyone"},{"key":"B","text":"The register also holds the applicants' national identifiers"},{"key":"C","text":"The postcode alone points to one applicant"},{"key":"D","text":"The test must be wrong, since linkage needs exact names"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Birth date, gender and postcode in combination single out almost everyone, so a join on them finds one match per person.","misconceptions":["","Assumes the attack needs an identifier; it joined on the quasi-identifiers only","Credits a single field; it is the combination that is unique","Denies the result; linkage needs shared fields, not names"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"linkage-attack","title":"A linkage attack joins the release to a file that has names"},"level":"understand","pool":"practice"},{"id":"q-privacy-06","type":"single","prompt":"In candidate release B, 2,152 records are unique on the quasi-identifiers. What is k for release B, and what does it say?","options":[{"key":"A","text":"k = 2,152: the number of records at risk"},{"key":"B","text":"k = 1: at least one record can be singled out on these fields"},{"key":"C","text":"k is unknown until a linkage test is run"},{"key":"D","text":"k = 1, so every single record in release B is unique"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"k is the size of the smallest equivalence class; a unique record is a class of one.","misconceptions":["Confuses k with a count of unique records","","Thinks k needs an outside file; it is computed from the release alone","Reads k, a minimum, as a statement about every class"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"equivalence-class","title":"An equivalence class is everyone who looks the same on the quasi-identifiers"},"level":"apply","pool":"practice"},{"id":"q-privacy-07","type":"single","prompt":"To reach k = 5, node (a) uses five-year birth bands and region and suppresses 293 records; node (b) uses ten-year bands and region and suppresses 84. The study asks how approval varies with age. What do you choose and report?","options":[{"key":"A","text":"(b), because fewer suppressed records always means more utility"},{"key":"B","text":"(a), without mentioning the suppressed records, since k is met"},{"key":"C","text":"Neither: k = 5 needs the age field removed entirely"},{"key":"D","text":"(a), reporting the suppressed records and the change by age"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The research question needs age detail, and a release reports both its suppression and its measured utility change.","misconceptions":["Counts only one cost; ten-year bands blur the age effect the study needs","Hides who was removed, which can bias the analysis","Contradicted by both nodes, which reach k = 5 with age kept",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"utility-cost","title":"The three key statistics moved by at most 1%"},"level":"apply","pool":"practice"},{"id":"q-privacy-08","type":"single","prompt":"After treatment k = 5, but in one class all five records have disability in household = yes. A recipient knows her neighbour is in that class. What has the treatment failed to prevent?","options":[{"key":"A","text":"Identity disclosure: she can now find her neighbour's exact record"},{"key":"B","text":"Nothing, since k = 5 protects every attribute"},{"key":"C","text":"Attribute disclosure: she learns the status without the record"},{"key":"D","text":"Membership inference, which arises only in synthetic data"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"When a class shares one sensitive value, membership in the class reveals it; k does not prevent this.","misconceptions":["Forgets that k = 5 leaves five candidates for one person","Reads k as a guarantee about attributes, which it does not give","","Names a different attack from another release type"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"k-limits","title":"k protects the fields you chose against the attacks you imagined"},"level":"analyze","pool":"practice"},{"id":"q-privacy-09","type":"single","prompt":"Yusr releases district counts with differential privacy at epsilon 0.5. What does this promise each applicant?","options":[{"key":"A","text":"Their record is removed from the data before the counts are made"},{"key":"B","text":"No count is off by more than 0.5"},{"key":"C","text":"No one can learn anything about their district"},{"key":"D","text":"The counts are almost as likely with or without their record"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Differential privacy bounds how much any one record can change the probability of the output.","misconceptions":["Confuses differential privacy with suppression","Reads epsilon as a bound on the error","Expects protection of group facts; the guarantee is about one person's record",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"dp-promise","title":"The output barely depends on whether any one person is in the data"},"level":"understand","pool":"practice"},{"id":"q-privacy-10","type":"single","prompt":"A count per district is released with the Laplace mechanism. Each applicant is in exactly one district. At epsilon 0.5, what is the noise scale?","options":[{"key":"A","text":"0.5: the scale equals epsilon"},{"key":"B","text":"2: sensitivity 1 divided by epsilon 0.5"},{"key":"C","text":"1: the scale equals the sensitivity"},{"key":"D","text":"0.25: sensitivity times epsilon"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The Laplace scale is sensitivity divided by epsilon; one applicant changes one count by 1.","misconceptions":["Uses epsilon as the scale; a smaller epsilon must mean more noise, not less","","Leaves epsilon out of the scale","Multiplies, which would add less noise for stronger privacy"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"sensitivity","title":"Noise is scaled to the most one person can change the answer"},"level":"apply","pool":"practice"},{"id":"q-privacy-11","type":"single","prompt":"Over a year the fund releases four tables about the same applicants at epsilon 0.1, 0.2, 0.2 and 0.5. What is the total privacy loss?","options":[{"key":"A","text":"1.0: releases about the same people add up"},{"key":"B","text":"0.5: the largest of the four"},{"key":"C","text":"0.25: their average"},{"key":"D","text":"0.1: the smallest, because it protects the most"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Under sequential composition, releases about the same people spend the sum of their epsilons.","misconceptions":["","Applies the parallel rule, which holds only for disjoint groups of people","Averages losses that accumulate","Thinks the strongest release covers the others"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"composition","title":"Epsilons add up over the same people, not over different people"},"level":"apply","pool":"practice"},{"id":"q-privacy-12","type":"single","prompt":"District counts at epsilon 0.1, 0.5 and 1 give a mean error of 9.98, 1.92 and 0.85, and a relative error in the ten smallest districts of 16%, 3.1% and 1.5%. The dashboard must keep small districts within about 5%. Which budget do you recommend?","options":[{"key":"A","text":"0.1, because the smallest budget is always the safest choice"},{"key":"B","text":"1, because its error is the lowest"},{"key":"C","text":"0.5: the smallest budget that meets the need in small districts"},{"key":"D","text":"Any of them, since all mean errors are below 10"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Choose the smallest epsilon whose error meets the use, measured where the error matters most.","misconceptions":["Ignores fitness for use: 16% error in small districts misleads readers","Spends more privacy than the stated need requires","","Judges by the average, which hides the small districts"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"recommend-budget","title":"Choose the smallest budget that meets the accuracy the use needs"},"level":"evaluate","pool":"practice"},{"id":"q-privacy-13","type":"single","prompt":"Bashayer says: \"The hackathon file is synthetic, so no applicant can be in it.\" What do you answer?","options":[{"key":"A","text":"She is right: synthetic rows are invented by definition"},{"key":"B","text":"A generator can copy training rows, so leakage is tested first"},{"key":"C","text":"She is right if the file has as many rows as the original"},{"key":"D","text":"Only a differentially private generator may ever be released at all"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A flexible generator can memorise its training data, so copying and membership inference are tested before release.","misconceptions":["Assumes a generator cannot reproduce its training rows","","Links privacy to the number of rows, which says nothing about copying","Overcorrects: measured leakage tests are another accepted basis for release"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"synthetic-idea","title":"A synthetic extract keeps the patterns and replaces the people"},"level":"understand","pool":"practice"},{"id":"q-privacy-14","type":"single","prompt":"0.10% of synthetic rows match a training record exactly, and 0.05% match a record from a holdout the generator never saw. What does this suggest?","options":[{"key":"A","text":"The file leaks, because any exact copy is a leak"},{"key":"B","text":"The holdout comparison means nothing, since the generator never saw it"},{"key":"C","text":"Utility is too low, because so few rows match real ones"},{"key":"D","text":"Copies are close to the rate of chance matches seen on the holdout"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Rows the generator never saw are matched almost as often, so most matches are coincidences of common values, not memorisation.","misconceptions":["Ignores matches by coincidence, which the holdout measures","Misses that the unseen holdout is the baseline for chance matches","Confuses copying with utility, which is measured on analyses",""],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"leakage-measures","title":"Compare distances to the training rows with distances to unseen rows"},"level":"apply","pool":"practice"},{"id":"q-privacy-15","type":"single","prompt":"A membership-inference test gives AUC 0.819 for a generator with leaves of one row, and 0.511 with leaves of 200 rows. What do you conclude?","options":[{"key":"A","text":"With leaves of 200, an attacker does little better than chance"},{"key":"B","text":"Leaves of one are better, since a higher AUC means more utility"},{"key":"C","text":"Neither can be released, since any AUC above 0.5 is leakage"},{"key":"D","text":"Nothing, since AUC measures the attack, not the file"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An AUC near 0.5 means the attacker cannot tell training rows from others; 0.819 means it often can.","misconceptions":["","Reads the attack's AUC as if it were a model's accuracy","Treats a value within noise of 0.5 as evidence of leakage","Misses that the attack's success is the measure of the file's leakage"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"synthetic-results","title":"The most useful file is the one that copies people"},"level":"apply","pool":"practice"},{"id":"q-privacy-16","type":"single","prompt":"The leaf-200 file copies 0.10% of rows (holdout 0.05%), membership AUC 0.511, and a model trained on it reaches AUC 0.933 against 0.936 on real data. The hackathon will train models. What do you recommend?","options":[{"key":"A","text":"Release the leaf-one file, which reproduces the real data more closely"},{"key":"B","text":"Release this file and stop running the tests, since they passed once"},{"key":"C","text":"Release this file with its leakage tests and generator settings documented"},{"key":"D","text":"Hold it until its utility matches the real data exactly"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Utility is close to real and leakage is at chance, so release with the evidence documented.","misconceptions":["Prefers fidelity over privacy; that file copied 92.8% of rows","Forgets that every regeneration needs the same release gate","","Asks for perfect utility, which only copying achieves"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"release-recommendation","title":"Release the leaf = 200 file for the hackathon, under stated limits"},"level":"evaluate","pool":"practice"},{"id":"q-fairness-17","type":"single","prompt":"In Al-Jouf, 4 non-Saudi women were eligible and the screen declined 3. How should the audit report this cell?","options":[{"key":"A","text":"As a false negative rate of 75%, the highest in the audit"},{"key":"B","text":"As too few to estimate, with the count of 4"},{"key":"C","text":"Merged with Saudi women in Al-Jouf, without saying so"},{"key":"D","text":"Not at all: the region is dropped from the report"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Below the minimum count the rate is not estimated; the count is reported so the reader sees why.","misconceptions":["Reports a rate from four people as if it were precise","","Changes the slice silently, which hides a choice from the reader","Removes evidence instead of stating its limit"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"small-cells","title":"Each extra attribute splits the data until the rates mean nothing"},"level":"apply","pool":"practice"},{"id":"q-fairness-18","type":"single","prompt":"Forcing equal selection rates for women and men opened a 12.4-point gap in their false negative rates. For a decision on housing support, which criterion fits?","options":[{"key":"A","text":"Equal false negative rates: the harm is missing eligible people"},{"key":"B","text":"Equal selection rates, which is what fairness means"},{"key":"C","text":"Equal precision, since every approved applicant must be eligible"},{"key":"D","text":"All three at once, by tuning the threshold carefully"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Equal opportunity fits a support decision: the error that harms is missing an eligible applicant.","misconceptions":["","Treats one criterion as the definition, regardless of the decision","Puts the fund's cost of wrong approvals before the applicant's harm","Different base rates make the criteria conflict; no threshold meets all three"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"choose-by-harm","title":"Choose the criterion from the decision and the harm of each error"},"level":"analyze","pool":"practice"},{"id":"q-fairness-19","type":"single","prompt":"Self-employed applicants' recorded income is 1.5 to 2 times their verified income, and the screen declines more than half of the eligible self-employed. Which bias type of the national AI Bias Reference Guide does this match?","options":[{"key":"A","text":"Historical bias"},{"key":"B","text":"Sampling bias"},{"key":"C","text":"Feedback loop bias"},{"key":"D","text":"Measurement bias"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A feature that records the quantity wrongly for one group is measurement bias.","misconceptions":["The past rule is a different finding; here the field itself is wrong","The self-employed are in the data; it is their values that are off","Describes retraining on the model's own outcomes, not a recorded value",""],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"bias-guide","title":"SDAIA's AI Bias Reference Guide defines more than a hundred bias types"},"level":"apply","pool":"practice"},{"id":"q-fairness-20","type":"single","prompt":"Group thresholds narrow the false negative gap from 12.9 to 10.0 points at the same accuracy. What must accompany them before deployment?","options":[{"key":"A","text":"Nothing, since accuracy did not fall"},{"key":"B","text":"Reweighting first, since post-processing is not allowed"},{"key":"C","text":"Approval to use gender and nationality, and an income fix"},{"key":"D","text":"Removing gender and nationality, so the rule cannot be challenged"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The rule uses protected attributes at decision time, which needs approval, and the cause lies in the income feature.","misconceptions":["Treats unchanged accuracy as the only cost","Invents a rule; reweighting barely helped here because the cause is a feature","","Contradicts itself: the thresholds need those attributes"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"group-thresholds","title":"A threshold per group, tuned on one half and reported on the other"},"level":"evaluate","pool":"practice"},{"id":"q-documentation-21","type":"single","prompt":"Malak fills the datasheet's De-identification section from her notebook's last run, which suppressed 290 records. The release log says 293. What should she write?","options":[{"key":"A","text":"290, since it is the more recent run"},{"key":"B","text":"293, the number in the log of the released run"},{"key":"C","text":"291.5, the average, with a note on uncertainty"},{"key":"D","text":"No number, since a difference of three does not matter"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The datasheet describes the release that left the fund, which the log recorded.","misconceptions":["Documents a run that was not the one approved and released","","Invents a number that no run produced","Drops a fact the reviewer needs to check the release"],"lo":["LO6"],"day":4,"session":1,"slide":{"deck":"day4","id":"from-the-log","title":"Fill the datasheet from the release log, never from memory"},"level":"apply","pool":"practice"},{"id":"q-documentation-22","type":"single","prompt":"The vendor reports 88.1% accuracy against officers' decisions in two regions; against the reviewed outcome of 12,000 applications it is 84.8%. What goes in the model card?","options":[{"key":"A","text":"88.1%, since it is the figure the model was approved on"},{"key":"B","text":"Both, without comment, so readers choose"},{"key":"C","text":"Neither, since accuracy says nothing about fairness"},{"key":"D","text":"84.8%, and why the vendor's 88.1% is not used"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Accuracy belongs against the reviewed outcome; naming the other figure prevents confusion.","misconceptions":["Repeats an evaluation the audit found biased","Leaves the reader to resolve a difference the author understands","Drops a metric the reviewer needs alongside the group results",""],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"which-accuracy","title":"Report accuracy against what really happened, not against officers"},"level":"apply","pool":"practice"},{"id":"q-documentation-23","type":"single","prompt":"Risk R2 (wrongful declines) scores likelihood 4 and impact 3. After adding officer review of every decline, Anmar rescores it as likelihood 2 and impact 1. Wiam rejects the new impact. Why?","options":[{"key":"A","text":"Review lowers the chance of a wrong decision, not the harm when one happens"},{"key":"B","text":"A residual cannot be scored until the treatment has run for a year"},{"key":"C","text":"A high risk can only be avoided, never mitigated"},{"key":"D","text":"Likelihood can never fall after a measured harm"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Treatment here acts on likelihood; an applicant still wrongly declined is harmed as before.","misconceptions":["","Invents a waiting rule; residual risk is scored when the treatment is chosen","Forgets that mitigate is one of the framework's four treatments","Denies that a control changes how probable the harm is"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"treat-residual","title":"A treatment usually lowers the likelihood, not the impact"},"level":"analyze","pool":"practice"},{"id":"q-documentation-24","type":"single","prompt":"A peer's script reproduces their claimed gap exactly. Your review finds it drops 633 rows with missing income, 65% of them women, and the README does not say so. What do you record?","options":[{"key":"A","text":"Nothing: a result that reproduces is confirmed"},{"key":"B","text":"Only that the result is not reproducible"},{"key":"C","text":"The filter, its place, its effect on the gap, and the fix"},{"key":"D","text":"That missing values should be dropped in every analysis they run"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A useful gap names the choice, its place in the code, its effect on the number and the fix.","misconceptions":["Takes reproduction as validity; the undocumented choice changes the answer","States a verdict the author cannot act on, and it is not even true here","","Turns one choice into a rule, when dropping them is what biased this result"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"useful-gap","title":"A useful gap says where, by how much, and what to write"},"level":"analyze","pool":"practice"}]}</script>
